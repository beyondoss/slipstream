name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - id: check
        run: |
          LOCAL=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(cargo search beyond-slipstream --limit 1 2>/dev/null | head -1 | sed -n 's/.*= "\(.*\)".*/\1/p')
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
  publish:
    name: Publish to crates.io
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no long-lived CARGO_REGISTRY_TOKEN secret.
    # Configure once at https://crates.io/crates/beyond-slipstream/settings/new-trusted-publisher
    #   Repository owner: beyondoss
    #   Repository name:  slipstream
    #   Workflow filename: release.yml
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
