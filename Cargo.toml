[workspace]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[package]
name = "beyond-slipstream"
version = "0.10.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared state in every service that needs it, kept in sync over NATS JetStream: local reads, restarts that resume, and no silently incomplete copies."

[lib]
name = "slipstream"
path = "src/lib.rs"

[dependencies]
aho-corasick = "1"
async-nats = "0.46"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1.8.5"
crc32fast = "1"
fjall = { version = "3", optional = true }
futures = "0.3"
object_store = { version = "0.13.2", optional = true, features = ["aws", "fs"] }
rocksdb = { package = "rust-rocksdb", version = "0.50", optional = true, default-features = false, features = ["lz4", "zstd", "bindgen-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4.46", optional = true }
tempfile = "3"
thiserror = "2"
# Parses the server time in a raw JetStream stream-info reply (`ts`), for the
# supersession-only resume check. Already in the tree via async-nats.
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"
# The `verus!` macro and the spec library. A normal build erases every proof (the macro expands to the plain Rust),
# so production pays nothing; only `cargo verus` checks them (`mise run verify`). Pinned to the release in
# dev/verus/VERSION.env.
vstd = "=0.0.0-2026-11-01-0251"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
stateright = "0.31.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "ack"
harness = false

[[bench]]
name = "applied"
harness = false

[[bench]]
name = "snapshot_backends"
harness = false
required-features = ["fjall", "rocksdb"]

[features]
fjall = ["dep:fjall"]
rocksdb = ["dep:rocksdb"]
# Artifact transport: tar wire format + object_store (S3/GCS/Azure/local-fs)
# upload/download, plus run_export_round. tokio/fs streams downloads to disk.
transport = ["dep:object_store", "dep:tar", "tokio/fs"]

# MODEL-TEST MUTATIONS. Each breaks one decision in `kernels::applied` so the
# matching Stateright model (`tests/model_applied.rs`,
# `tests/model_resync_order.rs`, `tests/model_repair.rs`) must find a counterexample. They exist only to
# prove the models can fail. NEVER enable them in a production build: each one
# reintroduces a data-loss or ordering bug. Run one with
# `cargo test --test <model> --features mut_<name>`.
# A failed store apply drops its raw batch instead of re-queuing it.
mut_drop_failed_batch = []
# A restart resumes from the in-memory cursor even when a store holds the data.
mut_resume_from_memory = []
# The resync acks before its synthetic deletes are folded.
mut_no_ack_barrier = []
# A repair does not drain the watch task's delivered backlog first.
mut_no_drain = []
# The pre-repair flush runs once instead of until the store holds everything.
mut_no_settle_retry = []
# A restore commits the artifact's cursor before it diffs the fold.
mut_cursor_before_diff = []
# A restore skips its ahead check and its listing window re-check, and the
# watch task its `restore_allowed` guard.
mut_no_restore_guard = []
# A restore skips the window re-check after listing live keys.
mut_no_listing_recheck = []
# The key-listing diff is trusted on a bucket that evicts current values.
mut_relist_on_evicting = []
# A fold with data but no cursor is re-listed blind.
mut_unanchored_relist = []
# The restore takes the artifact's value even when the local one is newer.
mut_restore_ignores_versions = []
# The restore deletes keys the bucket lists live.
mut_restore_ignores_listing = []
# The pointer guard compares revisions across incarnations (a dead incarnation's pointer wedges publishing).
mut_pointer_ignores_incarnation = []
# A fold with data and no cursor is trusted whatever stream it records.
mut_cursorless_fold_trusted = []
# A foreign cursor keeps its eviction memo (the old stream's) through the repair.
mut_foreign_keeps_memo = []
# The restore trusts a fold of another incarnation (a recreated bucket's old fold decides keys by its own revision numbers).
mut_restore_trusts_foreign = []
# The fold forgets that it saw retention evict current values.
mut_no_eviction_memo = []

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }
